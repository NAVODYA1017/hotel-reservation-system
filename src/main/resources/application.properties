# ═══════════════════════════════════════════════════════════════════════
# FILE : application.properties
# ROLE : Main configuration file for the Spring Boot application.
#        Spring Boot reads this file at startup to configure the app.
# ═══════════════════════════════════════════════════════════════════════

# Application name – used in logs and monitoring.
spring.application.name=hotel-reservation-system

# ── DATABASE CONFIGURATION ────────────────────────────────────────────
# spring.datasource.url – JDBC connection URL to the MySQL database.
#   jdbc:mysql://         → Use the MySQL JDBC driver.
#   localhost:3306        → MySQL server running on this machine, port 3306.
#   hotel_reservation_system → Database name.
#   useSSL=false          → Don't use SSL encryption (dev only).
#   serverTimezone=UTC    → Use UTC timezone for date/time values.
#   allowPublicKeyRetrieval=true → Allow the driver to retrieve the server's public key.
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_reservation_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Database login credentials.
spring.datasource.username=root
spring.datasource.password=root

# ── HIBERNATE (JPA) CONFIGURATION ────────────────────────────────────
# spring.jpa.hibernate.ddl-auto=update
#   → Hibernate automatically creates/updates database tables to match
#     the @Entity classes. Options:
#     none    – do nothing (production).
#     validate – only validate the schema, don't change it.
#     update  – create/update tables (ADD columns, never DROP). Good for dev.
#     create  – DROP all tables and re-create them every restart.
#     create-drop – same as create, but drops tables when app shuts down.
spring.jpa.hibernate.ddl-auto=update

# show-sql=true – prints every SQL query Hibernate executes to the console.
#   Useful for debugging. Set to false in production.
spring.jpa.show-sql=true

# dialect – tells Hibernate which SQL dialect to use.
#   MySQLDialect generates MySQL-specific SQL syntax.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# format_sql=true – pretty-prints SQL in the console (easier to read).
spring.jpa.properties.hibernate.format_sql=true

# ── SERVER CONFIGURATION ─────────────────────────────────────────────
# The embedded Tomcat server listens on this port.
# Access the API at: http://localhost:8080/api/...
server.port=8080
