<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Management - Ceylon Sanctuary</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Lato:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/room-admin/style.css?v=2">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand">Ceylon Sanctuary<br><span style="font-size:12px; font-family:'Lato', sans-serif; font-weight:300; letter-spacing:1px">Admin Dashboard</span></div>
        <ul class="sidebar-menu">
            <li>Dashboard</li>
            <li>Manage Reservations</li>
            <li class="active">Rooms & Halls</li>
            <li>Customers</li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">
            <h1>Room Management</h1>
            <button class="btn-primary" onclick="openNewModal()">+ Add New Room</button>
        </div>

        <div class="filter-bar">
            <div class="field">
                <label>Room Type</label>
                <select id="filterRoomType">
                    <option value="">All Types</option>
                </select>
            </div>
            <div class="field">
                <label>Status</label>
                <select id="filterStatus">
                    <option value="">All Status</option>
                    <option value="AVAILABLE">Available</option>
                    <option value="OCCUPIED">Occupied</option>
                    <option value="MAINTENANCE">Maintenance</option>
                </select>
            </div>
            <div class="field">
                <label>Floor</label>
                <input type="number" id="filterFloor" min="1" placeholder="Floor">
            </div>
            <button class="btn-secondary" onclick="fetchRooms()">Apply Filter</button>
            <button class="btn-secondary" onclick="resetFilter()">Reset</button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Room Number</th>
                        <th>Room Type</th>
                        <th>Floor</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr class="empty-row"><td colspan="7">Loading rooms...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add / Edit Modal -->
    <div class="modal-overlay" id="roomModal">
        <div class="modal">
            <button class="close" onclick="closeModal()">&times;</button>
            <h2 id="modalTitle">Add New Room</h2>
            <input type="hidden" id="modalRoomId">

            <div class="form-group">
                <label>Room Number *</label>
                <input type="text" id="modalRoomNumber" maxlength="20" placeholder="e.g. 101">
                <div class="field-error" id="errRoomNumber">Room number is required.</div>
            </div>

            <div class="form-group">
                <label>Room Type *</label>
                <select id="modalRoomType">
                    <option value="">Select Room Type</option>
                </select>
                <div class="field-error" id="errRoomType">Room type is required.</div>
            </div>

            <div class="form-group">
                <label>Floor *</label>
                <input type="number" id="modalFloor" min="1" placeholder="e.g. 1">
                <div class="field-error" id="errFloor">Floor is required.</div>
            </div>

            <div class="form-group">
                <label>Price (per night) *</label>
                <input type="number" id="modalPrice" min="0" step="0.01" placeholder="e.g. 100.00">
                <div class="field-error" id="errPrice">Price is required.</div>
            </div>

            <div class="form-group">
                <label>Status</label>
                <select id="modalStatus">
                    <option value="AVAILABLE">Available</option>
                    <option value="OCCUPIED">Occupied</option>
                    <option value="MAINTENANCE">Maintenance</option>
                </select>
            </div>

            <button class="btn-primary" style="width:100%" onclick="saveRoom()">Save Room</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="/room-admin/script.js?v=2"></script>
</body>
</html>
