<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rooms &amp; Venues — The Regent Court</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .venue-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 28px;
      margin-top: 32px;
    }

    .venue-photo-card {
      background: var(--surface, #1c1912);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform .2s, box-shadow .2s;
      display: flex;
      flex-direction: column;
    }

    .venue-photo-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 36px rgba(0, 0, 0, .45);
    }

    .venue-thumb {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      background: #2a2218;
    }

    .venue-thumb-placeholder {
      width: 100%;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2a2218 0%, #3a3020 100%);
      color: var(--ivory-dim, #b8a98a);
      font-family: 'Fraunces', serif;
      font-size: 22px;
      letter-spacing: .04em;
    }

    .venue-card-body {
      padding: 20px 22px 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .venue-card-body .price {
      margin-top: auto;
      padding-top: 12px;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: var(--brass-bright, #c9a44e);
    }

    .venue-card-body p {
      font-size: 14px;
      color: var(--ivory-dim, #b8a98a);
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div th:replace="~{fragments/layout :: header(active='venues')}"></div>

  <section class="page-hero">
    <div class="wrap">
      <div class="eyebrow">Rooms &amp; Venues</div>
      <h1>Every space, from suite to ballroom.</h1>
      <p>Browse accommodation and event spaces. Select any room to see full details and availability.</p>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="venue-grid">
        <a th:each="venue : ${venues}" class="venue-photo-card" th:href="@{/venues/{id}(id=${venue.venueId})}">
          <img th:if="${venue.imageUrl != null}" class="venue-thumb" th:src="${venue.imageUrl}"
            th:alt="${venue.hallName}">
          <div th:if="${venue.imageUrl == null}" class="venue-thumb-placeholder" th:text="${venue.hallName}">Venue</div>
          <div class="venue-card-body">
            <span class="tag"
              th:text="${venue.capacity >= 120 ? 'Event Venue' : (venue.capacity >= 4 ? 'Suite' : 'Room')}">Room</span>
            <h3 th:text="${venue.hallName}">Heritage Room</h3>
            <p th:text="${venue.description}">A beautiful venue for your special occasion.</p>
            <div class="price"
              th:text="${'$' + (venue.capacity >= 120 ? (venue.capacity == 120 ? 1100 : 1800) : 640) + (venue.capacity >= 120 ? ' / event' : ' / night')}">
              $180 / night</div>
          </div>
        </a>
      </div>
    </div>
  </section>

  <div th:replace="~{fragments/layout :: footer}"></div>

  <script src="/js/script.js"></script>
</body>

</html>
